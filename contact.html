<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact - mia</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="web-logo.png" type="image/png">
</head>
<body>
    <header class="header">
        <nav>
            <a href="https://yanbmia.github.io/" aria-label="home">
                <img src="logo.png" alt="MIA" class="nav-logo">
            </a>
            <ul>
                <li><a href="/more.html">MORE</a></li>
                <li><a href="/contact.html" aria-current="page">CONTACT</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="contact" class="hero hidden-fade">
            <h1>contact me</h1>

            <div class="contact-layout">
                <div class="contact-links">
                    <a href="https://linkedin.com/in/yanbmia" target="_blank" class="link-blue">
                        <span class="cl-key">linkedin</span>
                        <span>/in/yanbmia</span>
                        <span class="cl-arrow" aria-hidden="true">&#8594;</span>
                    </a>
                    <a href="https://github.com/yanbmia" target="_blank" class="link-green">
                        <span class="cl-key">github</span>
                        <span>@yanbmia</span>
                        <span class="cl-arrow" aria-hidden="true">&#8594;</span>
                    </a>
                    <a href="mailto:yanbmia@gmail.com" class="link-red">
                        <span class="cl-key">email</span>
                        <span>yanbmia@gmail.com</span>
                        <span class="cl-arrow" aria-hidden="true">&#8594;</span>
                    </a>
                </div>

                <form id="contact-form" class="contact-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="your@email.com">
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6" required placeholder="your message here..."></textarea>
                    </div>

                    <button type="submit" class="submit-btn">send</button>
                </form>
            </div>
        </section>
    </main>

    <!-- Floating chatbot toggle button -->
    <button id="chatbotToggle" class="chatbot-toggle" aria-label="Open chatbot">&#128172;</button>

    <!-- Chatbot side panel -->
    <div id="chatbotPanel" class="chatbot-panel">
        <div class="chatbot-panel-header">
            <span>Learn More</span>
            <button id="chatbotClose" class="chatbot-panel-close" aria-label="Close">&times;</button>
        </div>
        <div class="chatbot-container">
            <div id="chatLog" class="chat-log">
                <div class="chat-message bot">
                    <span class="chat-status" id="chatStatus">loading model...</span>
                </div>
            </div>
            <form id="chatForm" class="chat-form">
                <input type="text" id="chatInput" placeholder="ask a question..." autocomplete="off" disabled>
                <button type="submit" class="submit-btn" id="chatSubmit" disabled>&#8593;</button>
            </form>
        </div>
    </div>

    <footer>
        <p>thanks for visiting :)</p>
    </footer>
    <script src="chatbot-data.js"></script>
    <script src="script.js"></script>
    <script type="module" src="chatbot.js"></script>
</body>
</html>
